name: asahi

# Builds the Asahi Gallium and Honeykrisp Vulkan drivers with their unit tests
# on 64-bit Arm Linux and runs the asahi test suite.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asahi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04-arm
    container: fedora:44
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install dnf-plugins-core git
          dnf -y builddep mesa
          dnf -y install ccache clang

      - name: Check out
        uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-asahi-${{ github.sha }}
          restore-keys: ccache-asahi-

      - name: Configure
        run: |
          CC="ccache clang" CXX="ccache clang++" meson setup build \
            -Dgallium-drivers=asahi -Dvulkan-drivers=asahi \
            -Dplatforms=wayland,x11 -Dbuild-tests=true -Dtools=drm-shim

      - name: Build
        run: meson compile -C build

      - name: EGL diagnostics (train debug)
        run: |
          rpm -qa | grep -i -E 'glvnd|mesa-libEGL' || true
          ls -l /usr/lib64/libEGL* /usr/lib64/libGLdispatch* 2>&1 || true
          ls -l build/src/egl/ 2>&1 | head -30 || true
          cat build/src/egl/devenv_glvnd_egl.json 2>&1 || true
          python3 -c 'import ctypes,ctypes.util; print("find_library EGL:", ctypes.util.find_library("EGL"))
          try:
              ctypes.CDLL("libEGL.so.1"); print("libEGL.so.1 loads")
          except OSError as e: print("dlopen libEGL.so.1 failed:", e)' || true
          grep -i -E 'glvnd|with_egl|egl' build/meson-logs/meson-log.txt | grep -i -E 'glvnd|found' | head -10 || true

      - name: Test
        run: meson test -C build --suite asahi --suite poly --num-processes "$(nproc)" --print-errorlogs

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asahi-meson-logs
          path: build/meson-logs/
          retention-days: 5
